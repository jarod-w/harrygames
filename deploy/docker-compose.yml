services:
  api:
    build:
      context: ../server
    container_name: harrygames-api
    restart: unless-stopped
    environment:
      PORT: "8787"
      DB_PATH: /data/hogwarts.sqlite
      # Optional: set Dad's office runes on an empty database, comma-separated.
      # HEADMASTER_RUNES: "owl,wand,broom,bolt"
    volumes:
      - hogwarts-data:/data
  web:
    image: caddy:2-alpine
    container_name: harrygames-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web/dist:/srv:ro

volumes:
  hogwarts-data:
